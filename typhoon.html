<h1>Typhoon Track</h1>
<p></p>
<div id="hko_warnings_details" class="typhoon-panel" style="margin-bottom: 1rem;">Loading weather warnings…</div>
<div id="typhoon_points" class="typhoon-panel">Loading typhoon information…</div>
<!-- map container is created dynamically after data loads to avoid blank space -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  let retryTimes = 1;
  const hkCoordinates = { lat: 22.3193, lng: 114.1694 };
  //const typhoonApiHost = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:8080' : 'https://spark.cyrilng.com';
  const typhoonApiHost = 'https://spark.cyrilng.com';

  const typhoonListUrl = typhoonApiHost + '/typhoon-json/list';
  const trackContainer = document.getElementById('typhoon_points');
  const warningsContainer = document.getElementById('hko_warnings_details');
  let mapInstance = null;

  function removeMapContainer() {
    try {
      if (mapInstance) {
        mapInstance.remove();
        mapInstance = null;
      }
    } catch (e) {
      console.warn('Error removing map instance', e);
    }
    const existing = document.getElementById('typhoon_map');
    if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
  }

  function createMapContainer() {
    // ensure no previous container exists
    removeMapContainer();
    const div = document.createElement('div');
    div.id = 'typhoon_map';
    // give it a sensible default height so the map is visible
    div.style.minHeight = '360px';
    div.style.marginTop = '1rem';
    trackContainer.insertAdjacentElement('afterend', div);
    return div;
  }

  function formatBearing(deg) {
    if (!Number.isFinite(deg)) return null;
    const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    const index = Math.round(deg / 45) % directions.length;
    return `${Math.round(deg)}° ${directions[index]}`;
  }

  function getBearing(lat1, lon1, lat2, lon2) {
    const phi1 = deg2rad(lat1);
    const phi2 = deg2rad(lat2);
    const deltaLon = deg2rad(lon2 - lon1);
    const y = Math.sin(deltaLon) * Math.cos(phi2);
    const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLon);
    const theta = Math.atan2(y, x);
    return (theta * 180 / Math.PI + 360) % 360;
  }

  function getMovementSummary(typhoon) {
    const points = Array.isArray(typhoon?.points) ? typhoon.points : [];
    if (points.length < 2) return null;

    const currentPoint = getCurrentStatus(typhoon) || points[points.length - 1];
    const currentIndex = points.indexOf(currentPoint);
    const previousPoint = currentIndex > 0 ? points[currentIndex - 1] : points[points.length - 2];

    if (!previousPoint || !Number.isFinite(currentPoint?.lat) || !Number.isFinite(previousPoint?.lat)) {
      return null;
    }

    const distanceKm = getDistance(previousPoint.lat, previousPoint.lng, currentPoint.lat, currentPoint.lng);
    const previousTime = Date.parse(previousPoint.time);
    const currentTime = Date.parse(currentPoint.time);
    const hours = Number.isFinite(previousTime) && Number.isFinite(currentTime) && currentTime > previousTime
      ? (currentTime - previousTime) / 3600000
      : null;
    const speedKph = hours && hours > 0 ? distanceKm / hours : null;
    const bearing = getBearing(previousPoint.lat, previousPoint.lng, currentPoint.lat, currentPoint.lng);

    return { bearing, distanceKm, speedKph };
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatWarningTime(value) {
    if (!value) return 'N/A';
    try {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString([], {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    } catch (e) {
      return value;
    }
  }

  function getWarningTitle(detail) {
    if (!detail) return 'Weather Warning';
    if (Object.hasOwn(detail, 'subtype')) {
      return WARNING_DESCRIPTION_MAP?.[detail.subtype] || detail.subtype || 'Weather Warning';
    }
    return WARNING_DESCRIPTION_MAP?.[detail.warningStatementCode] || detail.warningStatementCode || 'Weather Warning';
  }

  function renderHkoWarnings(payload) {
    const details = Array.isArray(payload?.details) ? payload.details : [];

    if (!warningsContainer) return;

    if (!details.length) {
      warningsContainer.innerHTML = '<div style="font-size: 0.95rem;">No active weather warnings.</div>';
      return;
    }

    warningsContainer.innerHTML = details.map((detail) => {
      const title = getWarningTitle(detail);
      const contents = Array.isArray(detail.contents) ? detail.contents.filter(Boolean) : [];
      const listItems = contents.map((item) => {
        const escapedText = escapeHtml(item).replace(/\n/g, '<br>');
        return `<li style="margin-bottom: 0.4rem;">${escapedText}</li>`;
      }).join('');
      const timeText = detail.updateTime ? `<div style="font-size: 0.8rem; color: #ccc; margin-top: 0.35rem;">Updated ${formatWarningTime(detail.updateTime)}</div>` : '';

      return `
        <div style="margin-bottom: 0.8rem; padding: 0.8rem; border: 1px solid #555; border-radius: 6px; background: #2a2a2a;">
          <div><strong>${escapeHtml(title)}</strong></div>
          <ul style="margin: 0.4rem 0 0 1rem; padding: 0; font-size: 0.9rem; line-height: 1.4;">${listItems}</ul>
          ${timeText}
        </div>
      `;
    }).join('');
  }

  function attachHkoWarningsStream() {
    if (!warningsContainer) return;

    try {
      const source = new EventSource(typhoonApiHost + '/hko/warnings/stream');
      source.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          renderHkoWarnings(payload);
        } catch (error) {
          console.error('Failed to parse HKO warnings payload:', error);
          warningsContainer.innerHTML = '<div style="color: #a00;">Unable to load weather warnings.</div>';
        }
      };
      source.onerror = (error) => {
        console.error('HKO warnings stream error:', error);
        warningsContainer.innerHTML = '<div style="color: #a00;">Unable to load weather warnings right now.</div>';
      };
    } catch (error) {
      console.error('Failed to connect to HKO warnings stream:', error);
      warningsContainer.innerHTML = '<div style="color: #a00;">Unable to load weather warnings right now.</div>';
    }
  }

  function createStatusHtml(typhoons) {
    const lines = typhoons.map(typhoon => {
      const currentPoint = getCurrentStatus(typhoon);
      const nearestPoint = getNearestPoint(typhoon);
      const movement = getMovementSummary(typhoon);
      const distanceText = `Current distance from HK: ${currentPoint?.dist?.toFixed(0)} km`;
      const bearingText = currentPoint ? `Bearing from HK: ${formatBearing(getBearing(hkCoordinates.lat, hkCoordinates.lng, currentPoint.lat, currentPoint.lng))}` : '';
      const movementText = movement ? `Movement: ${formatBearing(movement.bearing)}${movement.speedKph ? ` · ${movement.speedKph.toFixed(0)} km/h` : ''}` : '';
      const nearestText = `Nearest approach to HK: ${nearestPoint?.dist?.toFixed(0)} km ${nearestPoint?.time ?? ""}`;
      const lastUpdatedText = `Last update: ${typhoon.bulletinTime || currentPoint?.time || 'N/A'}`;
      return `
      <div style="margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #ddd;">
        <div><strong style="color: ${typhoon.color};">● ${currentPoint?.intensity} ${typhoon.tropicalCycloneName}</strong></div>
        <div style="font-size: 0.9rem;">${typhoon.bulletinTime} · Maximum wind speed: ${currentPoint?.maximumWind} · (${currentPoint?.latitude} ${currentPoint?.longitude})</div>
        <div style="font-size: 0.85rem;">${distanceText}</div>
        <div style="font-size: 0.85rem;">${bearingText}</div>
        <div style="font-size: 0.85rem;">${movementText}</div>
        <div style="font-size: 0.85rem;">${nearestText}</div>
        <div style="font-size: 0.8rem; color: #ccc;">${lastUpdatedText}</div>
      </div>
    `;
    }).join('');
    return lines;
  }

  function renderMap(typhoons) {
    // create container only now and initialise the map
    createMapContainer();
    const map = L.map('typhoon_map', { zoomControl: true });
    mapInstance = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 10,
      minZoom: 4
    }).addTo(map);

    let allBounds = [];
    const colors = ['#a00', '#f90', '#0a0', '#00a', '#a0a', '#0aa', '#fa0', '#a00'];

    typhoons.forEach((typhoon, typhoonIndex) => {
      // ${typhoon.points.length} track point${typhoon.points.length !== 1 ? 's' : ''}
      const points = typhoon.points;
      const path = points.map((point) => [point.lat, point.lng]);

      if (path.length === 0) return;

      const color = colors[typhoonIndex % colors.length];
      const polyline = L.polyline(path, { color: color, weight: 3, opacity: 0.8 }).addTo(map);
      allBounds = allBounds.concat(path);

      points.forEach((point, index) => {
        if ((typeof point.intensity === "undefined")) {
          // ignore points with missing information
          return;
        }
        const marker = L.circleMarker([point.lat, point.lng], {
          radius: 5,
          fillColor: color,
          color: '#333',
          weight: 1,
          fillOpacity: 0.8,
        }).addTo(map);
        marker.bindPopup(`
        <strong>${typhoon.tropicalCycloneName}</strong><br>
        ${point.time}<br>
        ${point.intensity}<br>
        ${point.maximumWind}<br>

        if (point.timePeriod === "CURRENT") {

              iconSize: [20, 20]
            })
          }).addTo(map).bindPopup(`
          <strong>${typhoon.tropicalCycloneName}</strong><br>
          ${point.time}<br>
          ${point.intensity}<br>
          ${point.maximumWind}<br>
          ${point.dist.toFixed(0)}km (${point.latitude}, ${point.longitude})
      `);
          L.marker([point.lat, point.lng], {
            icon: L.divIcon({
              html: typhoon.tropicalCycloneName,
              className: 'typhoon-label',
              iconAnchor: [30, -20]
            })
          }).addTo(map);
        }

      });
    });
    const HK = L.circleMarker([hkCoordinates.lat, hkCoordinates.lng], {
      radius: 5,
      fillColor: '#000',
      color: '#333',
      weight: 1,
      fillOpacity: 0.8,
    }).addTo(map).bindPopup(`
        <strong>Hong Kong</strong><br>
        (${hkCoordinates.lat}, ${hkCoordinates.lng})
      `);
    allBounds.concat([hkCoordinates.lat, hkCoordinates.lng]);
    // center the map
    if (allBounds.length > 0) {
      const bounds = L.latLngBounds(allBounds);
      map.fitBounds(bounds.pad(0.45));
    }
  }

  async function loadTyphoon() {
    try {
      console.log("loadTyphoon()");
      const listResp = await fetch(typhoonListUrl, { credentials: 'same-origin' });
      if (!listResp.ok) throw new Error('Failed to fetch typhoon list: ' + listResp.status);
      const typhoons = await listResp.json();
      if (!Array.isArray(typhoons) || typhoons.length === 0) {
        trackContainer.textContent = 'No active typhoons available from the API.';
        return;
      }

      const colors = ['#a00', '#f90', '#0a0', '#00a', '#a0a', '#0aa', '#fa0', '#a00'];
      const typhoonDataList = [];

      // Fetch track data for all typhoons
      for (let i = 0; i < typhoons.length; i++) {
        const typhoon = typhoons[i];
        try {
          const trackResp = await fetch(typhoonApiHost + '/typhoon-json/track/' + encodeURIComponent(typhoon.id), { credentials: 'same-origin' });
          if (!trackResp.ok) throw new Error('Failed to fetch typhoon track: ' + trackResp.status);
          const trackData = await trackResp.json();
          const rawPoints = Array.isArray(trackData.track) ? trackData.track : [];

          const points = rawPoints.map((point) => {
            const lat = parseCoordinate(point.latitude);
            const lng = parseCoordinate(point.longitude);
            const dist = getDistance(hkCoordinates.lat, hkCoordinates.lng, lat, lng);
            return {
              ...point,
              lat: lat,
              lng: lng,
              dist: dist
            };
          }).filter((point) => Number.isFinite(point.lat) && Number.isFinite(point.lng));

          //console.log(JSON.stringify(points));

          typhoonDataList.push({
            ...trackData,
            points: points,
            color: colors[i % colors.length],
          });
        } catch (error) {
          console.error('Error fetching track for typhoon ' + typhoon.id + ':', error);
        }
      }

      if (typhoonDataList.length === 0) {
        trackContainer.textContent = 'No valid typhoon track data available.';
        // ensure no map is shown when there's no data
        removeMapContainer();
        return;
      }

      trackContainer.innerHTML = createStatusHtml(typhoonDataList);
      renderMap(typhoonDataList);
    } catch (error) {
      console.error(error);
      trackContainer.innerHTML = `<span style="color: #a00;">Unable to load typhoon data.</span> ${error.message}`;
      // remove map if an error occurred — do not display a blank map
      removeMapContainer();
      await new Promise(r => setTimeout(r, 1000 * retryTimes++));
      loadTyphoon();
    }
  }

  // document.addEventListener('DOMContentLoaded', loadTyphoon);

  window.addEventListener("load", () => {
    // Runs only after images, frames, and styles are finished loading
    attachHkoWarningsStream();
    loadTyphoon();
  });
</script>
